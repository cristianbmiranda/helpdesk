<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - HelpDesk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #60a5fa, #10b981);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-box {
            background-color: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
            text-align: center;
        }
        .sub-logo {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 25px;
        }
        .link-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">HelpDesk</div>
        <div class="sub-logo">Prefeitura de Amambai-MS</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuário</label>
                <input type="text" class="form-control" name="usuario" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" name="senha" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Entrar</button>
        </form>

        <div class="link-container">
            <a href="{{ url_for('recuperar_senha') }}">Esqueci minha senha</a>
            <a href="{{ url_for('cadastrar_usuario') }}">Criar uma conta</a>
        </div>
    </div>
</body>
</html>
